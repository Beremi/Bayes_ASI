name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install MPI
        run: |
          sudo apt-get update
          sudo apt-get install --yes openmpi-bin libopenmpi-dev
      - name: Install package and example dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run unit and callback tests
        run: python -m unittest discover -s tests

  quality-and-package:
    name: Quality and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install MPI and development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes openmpi-bin libopenmpi-dev
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Run static checks
        run: |
          ruff check .
          mypy src tests
          python -m compileall -q src tests
          git diff --check
      - name: Build and inspect distributions
        run: |
          python -m build
          python -m twine check dist/*
          python -m pip install --force-reinstall --no-deps dist/*.whl
          bayes-asi --version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  mpi-integration:
    name: MPI integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMPI_MCA_rmaps_base_oversubscribe: "1"
      # Open MPI 5 delegates launcher mapping to PRRTE.
      PRTE_MCA_rmaps_default_mapping_policy: ":oversubscribe"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install MPI and package
        run: |
          sudo apt-get update
          sudo apt-get install --yes openmpi-bin libopenmpi-dev
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run synthetic MPI suite
        env:
          BAYES_ASI_MPI_TEST: "1"
        run: python -m unittest tests.test_mpi_smoke
      - name: Run expensive Darcy MPI suite
        env:
          BAYES_ASI_DARCY_MPI_TEST: "1"
        run: python -m unittest tests.test_darcy_mpi
