[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bayes-asi"
version = "0.1.0"
description = "Adaptive surrogate Bayesian inversion with MPI solver workers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "h5py",
  "mpi4py",
  "numpy",
  "pyyaml",
  "torch",
]

[project.scripts]
bayes-asi = "bayes_asi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

