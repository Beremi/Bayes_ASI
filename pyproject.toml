[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bayes-asi"
version = "0.2.0"
description = "Problem-agnostic adaptive surrogate Bayesian inversion with MPI solver workers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "h5py",
  "mpi4py",
  "numpy",
  "pyyaml",
  "torch",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.scripts]
bayes-asi = "bayes_asi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
