run:
  output_dir: runs/linear_gaussian
  time_budget_seconds: 15
  seed: 20260701
  status_interval_seconds: 1.0

problem:
  latent_dim: 2
  parameter_dim: 2
  output_dim: 3

solver:
  factory: bayes_asi.examples.linear_gaussian:make_solver

posterior:
  factory: bayes_asi.examples.linear_gaussian:make_posterior
  kwargs:
    theta_true: [0.8, -1.1]
    noise_sd: [0.08, 0.12, 0.10]
    prior_sd: [2.0, 2.0]

initial_design:
  n_points: 10

surrogate:
  hidden_layers: [16, 16]
  max_epochs: 150
  batch_size: 32
  validation_fraction: 0.0
  patience: 30
  min_train_samples: 8
  update_after_new_samples: 3

hmc:
  n_chains: 4
  warmup_steps: 30
  samples_per_chain: 50
  initial_step_size: 0.08
  min_leapfrog_steps: 2
  max_leapfrog_steps: 10

active_learning:
  candidate_pool_size: 160
  batch_max_size: 4

queue:
  target_seconds_ahead: 1.0
