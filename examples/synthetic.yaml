run:
  output_dir: runs/synthetic
  time_budget_seconds: 20
  drain_running_on_exit: true
  seed: 123
  status_interval_seconds: 1.0

problem:
  latent_dim: 2
  parameter_dim: 2
  output_dim: 2

solver:
  factory: bayes_asi.examples.synthetic:make_solver
  kwargs:
    sleep_seconds: 0.02

posterior:
  factory: bayes_asi.examples.synthetic:make_posterior
  kwargs:
    theta_true: [0.7, -1.2]
    noise_sd: [0.12, 0.18]

initial_design:
  n_points: 12

surrogate:
  hidden_layers: [48, 48]
  learning_rate: 0.001
  max_epochs: 250
  batch_size: 64
  validation_fraction: 0.2
  patience: 30
  min_train_samples: 10
  update_after_new_samples: 4
  retrain_from_scratch_every: 3
  scratch_improvement_rel: 0.03
  device: cpu

hmc:
  n_chains: 4
  warmup_steps: 50
  samples_per_chain: 80
  target_accept: 0.8
  initial_step_size: 0.08
  min_leapfrog_steps: 2
  max_leapfrog_steps: 16

active_learning:
  candidate_pool_size: 160
  batch_max_size: 6
  posterior_weight: 1.0
  distance_weight: 0.7

queue:
  min_pending_per_worker: 1
  max_pending_per_worker: 2
  refill_threshold_pending_per_worker: 1
  target_seconds_ahead: 2.0
  retry_limit: 1

